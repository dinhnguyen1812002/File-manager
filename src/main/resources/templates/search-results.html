<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::main}, 'Kết quả tìm kiếm')}">
<body>
<main>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <div class="mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <h1 class="text-xl font-semibold text-gray-800">Kết quả tìm kiếm</h1>
                    <span class="text-sm text-green-700 bg-green-50 border border-green-200 px-3 py-0.5 rounded-full font-medium"
                          th:text="'&quot;' + ${query} + '&quot;'"></span>
                </div>
                <span class="text-sm text-gray-400"
                      th:text="${results.totalElements} + ' kết quả'"></span>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white border border-gray-200 rounded-xl p-4 mb-6">
            <form th:action="@{/search}" method="get" class="flex flex-wrap items-end gap-3">
                <input type="hidden" name="q" th:value="${query}">

                <div class="flex-1 min-w-[150px]">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">Loại file</label>
                    <select name="type"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
                        <option value="">Tất cả</option>
                        <option value="folder" th:selected="${type == 'folder'}">Folder</option>
                        <option value="pdf"    th:selected="${type == 'pdf'}">PDF</option>
                        <option value="image"  th:selected="${type == 'image'}">Hình ảnh</option>
                        <option value="doc"    th:selected="${type == 'doc'}">Tài liệu</option>
                    </select>
                </div>

                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">Từ ngày</label>
                    <input type="datetime-local" name="start" th:value="${start}"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
                </div>

                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">Đến ngày</label>
                    <input type="datetime-local" name="end" th:value="${end}"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
                </div>

                <button type="submit"
                        class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors">
                    <i class="fas fa-filter mr-1.5"></i>Lọc
                </button>
                <a th:href="@{/search(q=${query})}"
                   class="px-5 py-2 bg-white hover:bg-gray-50 text-gray-500 text-sm font-medium rounded-lg border border-gray-200 transition-colors">
                    Đặt lại
                </a>
            </form>
        </div>

        <!-- Results Table -->
        <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <table class="min-w-full divide-y divide-gray-100">
                <thead>
                <tr class="bg-gray-50">
                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Tên</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Loại</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Kích thước</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Vị trí</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Ngày sửa đổi</th>
                    <th class="px-5 py-3 text-right text-xs font-semibold text-gray-400 uppercase tracking-wider">Thao tác</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="item : ${results.content}"
                    class="hover:bg-green-50 transition-colors group">

                    <!-- Tên -->
                    <td class="px-5 py-3">
                        <div class="flex items-center gap-2.5">
                            <i th:class="${item.isFolder ? 'fas fa-folder text-yellow-400' : 'fas fa-file-alt text-green-500'}"></i>
                            <span class="text-sm font-medium text-gray-800" th:text="${item.name}"></span>
                        </div>
                    </td>

                    <!-- Loại -->
                    <td class="px-5 py-3">
                            <span th:switch="${item.type}">
                                <span th:case="'folder'" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-50 text-yellow-700 border border-yellow-200">Folder</span>
                                <span th:case="'pdf'"    class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-600 border border-red-200">PDF</span>
                                <span th:case="'image'"  class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-purple-50 text-purple-600 border border-purple-200">Hình ảnh</span>
                                <span th:case="'doc'"    class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-600 border border-blue-200">Tài liệu</span>
                                <span th:case="*"        class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 border border-gray-200" th:text="${item.type}"></span>
                            </span>
                    </td>

                    <!-- Kích thước -->
                    <td class="px-5 py-3 text-sm text-gray-500"
                        th:text="${item.isFolder ? '—' : #numbers.formatDecimal(item.size / 1024.0 / 1024.0, 1, 2) + ' MB'}"></td>

                    <!-- Vị trí -->
                    <td class="px-5 py-3">
                            <span class="text-xs text-gray-400 font-mono bg-gray-50 px-2 py-0.5 rounded"
                                  th:text="${item.path}"></span>
                    </td>

                    <!-- Ngày sửa đổi -->
                    <td class="px-5 py-3 text-sm text-gray-500"
                        th:text="${#temporals.format(item.modifiedDate, 'dd/MM/yyyy HH:mm')}"></td>

                    <!-- Thao tác -->
                    <td class="px-5 py-3">
                        <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">

                            <!-- Preview -->
                            <button class="preview-file-btn p-1.5 bg-white rounded-lg shadow-sm hover:bg-green-50 border border-gray-200 hover:border-green-300 transition-colors"
                                    th:data-file-id="${item.id}"
                                    th:data-file-name="${item.name}"
                                    title="Xem trước">
                                <i class="fas fa-eye text-xs text-gray-500"></i>
                            </button>

                            <!-- Download -->
                            <a th:href="@{/files/download/{id}(id=${item.id})}"
                               class="p-1.5 bg-white rounded-lg shadow-sm hover:bg-blue-50 border border-gray-200 hover:border-blue-300 inline-flex items-center justify-center transition-colors"
                               title="Tải xuống">
                                <i class="fas fa-download text-xs text-gray-500"></i>
                            </a>

                            <!-- Share -->
                            <button class="share-file-btn p-1.5 bg-white rounded-lg shadow-sm hover:bg-green-50 border border-gray-200 hover:border-green-300 transition-colors"
                                    th:data-file-id="${item.id}"
                                    th:data-file-name="${item.name}"
                                    title="Chia sẻ">
                                <i class="fas fa-share text-xs text-gray-500"></i>
                            </button>

                            <!-- Delete -->
                            <a th:href="@{/files/delete/{id}(id=${item.id})}"
                               onclick="return confirm('Chuyển file này vào thùng rác?');"
                               class="p-1.5 bg-white rounded-lg shadow-sm hover:bg-red-50 border border-gray-200 hover:border-red-300 inline-flex items-center justify-center transition-colors"
                               title="Xóa">
                                <i class="fas fa-trash text-xs text-red-500"></i>
                            </a>
                        </div>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${results.isEmpty()}">
                    <td colspan="6" class="px-6 py-16 text-center">
                        <div class="flex flex-col items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
                                <i class="fas fa-search text-gray-300 text-lg"></i>
                            </div>
                            <p class="text-sm text-gray-400">Không tìm thấy kết quả nào phù hợp.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${results.totalPages > 1}" class="mt-6 flex items-center justify-between">
            <p class="text-sm text-gray-400"
               th:text="'Trang ' + (${results.number} + 1) + ' / ' + ${results.totalPages}"></p>

            <nav class="flex items-center gap-1">
                <!-- Prev -->
                <a th:href="@{/search(q=${query}, type=${type}, start=${start}, end=${end}, page=${results.number - 1})}"
                   th:if="${results.hasPrevious()}"
                   class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition-colors">
                    <i class="fas fa-chevron-left text-xs"></i>
                </a>

                <!-- Pages -->
                <span th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}"
                      th:if="${i >= results.number - 2 && i <= results.number + 2}">
                    <a th:href="@{/search(q=${query}, type=${type}, start=${start}, end=${end}, page=${i})}"
                       th:text="${i + 1}"
                       th:class="${i == results.number}
                           ? 'w-8 h-8 flex items-center justify-center rounded-lg text-sm font-semibold bg-green-600 text-white border border-green-600'
                           : 'w-8 h-8 flex items-center justify-center rounded-lg text-sm text-gray-500 border border-gray-200 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition-colors'">
                    </a>
                </span>

                <!-- Next -->
                <a th:href="@{/search(q=${query}, type=${type}, start=${start}, end=${end}, page=${results.number + 1})}"
                   th:if="${results.hasNext()}"
                   class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition-colors">
                    <i class="fas fa-chevron-right text-xs"></i>
                </a>
            </nav>
        </div>

    </div>
</main>
</body>
</html>
