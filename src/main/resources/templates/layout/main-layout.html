<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, activePage)" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${activePage} + ' - FileHub'">FileHub</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#10b981'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* Page transition animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        main { animation: fadeIn 0.3s ease-out; }
        .file-card { animation: fadeIn 0.4s ease-out; }
        .file-card:nth-child(1) { animation-delay: 0.05s; }
        .file-card:nth-child(2) { animation-delay: 0.1s; }
        .file-card:nth-child(3) { animation-delay: 0.15s; }
        .file-card:nth-child(4) { animation-delay: 0.2s; }
        
        /* Folder square aspect ratio */
        .folder-card-square { 
            aspect-ratio: 4 / 3; 
            position: relative;
        }
        
        /* Dropdown menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.25rem;
            min-width: 10rem;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }
        
        .dropdown-menu.show {
            display: block;
        }
    </style>
</head>
<body class="bg-white font-sans antialiased" x-data="dashboardApp(window.__DASHBOARD__)" x-init="initDashboard()">
    
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header}"></div>

            <!-- Breadcrumb -->
            <div th:replace="~{fragments/breadcrumb :: breadcrumb(${activePage})}"></div>

            <!-- Content Area -->
            <main class="flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
                <div class="p-6">
                    <div th:replace="${content}"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div th:replace="~{component/model :: createFolderModal}"></div>
    <div th:replace="~{component/model :: uploadModal}"></div>
    <div th:replace="~{component/model :: shareModal}"></div>
    <div th:replace="~{component/model :: moveModal}"></div>
    <div th:replace="~{component/model :: filePreviewModal}"></div>
    <div th:replace="~{component/model :: passwordVerificationModal}"></div>
    <div th:replace="~{component/model :: passwordModal}"></div>

    <script th:inline="javascript">
        window.__DASHBOARD__ = /*[[${dashboardViewModel}]]*/ null;
    </script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
