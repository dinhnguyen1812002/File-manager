<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar" 
    class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300"
    :class="sidebarCollapsed ? 'w-16' : 'w-64'">
    
    <!-- Logo -->
    <div class="h-16 flex items-center px-4 border-b border-gray-200">
        <div class="flex items-center space-x-2 flex-1">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center flex-shrink-0">
                <i class="fas fa-cloud text-white text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" 
                  x-transition:enter="transition ease-out duration-200"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-lg font-semibold text-gray-900">FileHub</span>
        </div>
        <button @click="sidebarCollapsed = !sidebarCollapsed" 
            class="p-1.5 hover:bg-gray-100 rounded transition-colors"
            :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
            <i class="fas text-gray-600 text-sm transition-transform duration-300"
               :class="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
        <a th:href="@{/files/dashboard}"
            th:classappend="${activePage == 'Dashboard' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
            class="flex items-center px-3 py-2 rounded transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Dashboard' : ''">
            <i class="fas fa-home text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed" 
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Dashboard</span>
        </a>

        <a th:href="@{/files/my-files}"
            th:classappend="${activePage == 'My Files' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
            class="flex items-center px-3 py-2 rounded transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'My Files' : ''">
            <i class="fas fa-folder text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">My Files</span>
        </a>

        <a th:href="@{/files/shared}"
            th:classappend="${activePage == 'Shared Files' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
            class="flex items-center px-3 py-2 rounded transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Shared' : ''">
            <i class="fas fa-share-alt text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Shared</span>
        </a>

        <a href="#"
            class="flex items-center px-3 py-2 rounded text-gray-600 hover:bg-gray-50 transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Recent' : ''">
            <i class="fas fa-clock text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Recent</span>
        </a>

        <a href="#"
            class="flex items-center px-3 py-2 rounded text-gray-600 hover:bg-gray-50 transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Favorites' : ''">
            <i class="fas fa-star text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Favorites</span>
        </a>

        <div class="border-t border-gray-200 my-2"></div>

        <a th:href="@{/profile}"
            th:classappend="${activePage == 'Profile' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
            class="flex items-center px-3 py-2 rounded transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Profile' : ''">
            <i class="fas fa-user text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Profile</span>
        </a>

        <a th:href="@{/files/trash}"
            th:classappend="${activePage == 'Trash' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}"
            class="flex items-center px-3 py-2 rounded transition-all duration-200"
            :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'"
            :title="sidebarCollapsed ? 'Trash' : ''">
            <i class="fas fa-trash text-sm" :class="sidebarCollapsed ? '' : 'w-4'"></i>
            <span x-show="!sidebarCollapsed"
                  x-transition:enter="transition ease-out duration-200 delay-75"
                  x-transition:enter-start="opacity-0"
                  x-transition:enter-end="opacity-100"
                  class="text-sm">Trash</span>
        </a>
    </nav>

    <!-- Storage (when expanded) -->
    <div x-show="!sidebarCollapsed" 
         x-transition:enter="transition ease-out duration-200 delay-100"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="p-4 border-t border-gray-200"
         th:if="${dashboardViewModel != null and dashboardViewModel.metrics != null}">
        <div class="mb-3">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-700">Storage</span>
                <span class="text-xs text-gray-500"
                      th:text="${#numbers.formatDecimal(dashboardViewModel.metrics.storageUsagePercentage, 1, 0)} + '%'">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div class="bg-primary h-1.5 rounded-full transition-all duration-500"
                     th:style="'width: ' + ${dashboardViewModel.metrics.storageUsagePercentage} + '%'"></div>
            </div>
            <p class="text-xs text-gray-500 mt-2"
               th:text="${dashboardViewModel.metrics.storageUsed} + ' / ' + ${dashboardViewModel.metrics.storageLimit}">
                0 B / 10 GB
            </p>
        </div>
    </div>

    <!-- User Profile -->
    <div class="p-3 border-t border-gray-200" th:with="user=${#authentication.principal}">
        <div class="flex items-center" :class="sidebarCollapsed ? 'justify-center' : 'space-x-3'">
            <img th:src="${user.avatar != null ? '/uploads/avatars/' + user.avatar : 'https://ui-avatars.com/api/?name=' + user.username + '&background=10b981&color=fff'}"
                class="w-8 h-8 rounded-full object-cover flex-shrink-0" 
                th:alt="${user.username}">
            <div x-show="!sidebarCollapsed"
                 x-transition:enter="transition ease-out duration-200 delay-75"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 class="flex-1 min-w-0">
                <p class="text-sm font-medium text-gray-900 truncate" th:text="${user.username}">User</p>
                <a th:href="@{/profile}" class="text-xs text-gray-500 hover:text-primary transition-colors">View profile</a>
            </div>
        </div>
    </div>
</aside>
</html>
