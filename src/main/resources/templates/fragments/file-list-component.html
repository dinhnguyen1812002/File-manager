<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:x-transition="http://www.w3.org/1999/xhtml">
<div th:fragment="fileList(subFolders, files, isTrash)" class="space-y-9">

    <!-- Quick Actions Bar -->
    <div class="mb-6 flex items-center justify-between mt-5">
        <div class="flex items-center space-x-4">
            <!-- Select All -->
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-green-600 rounded focus:ring-green-500"
                    @change="toggleSelectAll($event)">
                <span class="text-sm text-gray-700">Select All</span>
            </label>

            <!-- Bulk Actions -->
            <div x-show="selectedFiles.length > 0" class="flex items-center space-x-2">
                <span class="text-sm text-gray-600">
                    <span x-text="selectedFiles.length"></span> selected
                </span>
                <button @click="downloadSelectedFiles()" class="px-3 py-1.5 text-sm bg-green-100 text-green-700 rounded-lg hover:bg-indigo-200">
                    <i class="fas fa-download mr-1"></i> Download
                </button>
                <button @click="deleteSelectedFiles()" class="px-3 py-1.5 text-sm bg-red-100 text-red-700 rounded-lg hover:bg-red-200">
                    <i class="fas fa-trash mr-1"></i> Delete
                </button>
            </div>
        </div>

        <!-- Sort & Filter -->
        <div class="flex items-center space-x-2">
            <select
                class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                <option>Sort by: Name</option>
                <option>Sort by: Date</option>
                <option>Sort by: Size</option>
                <option>Sort by: Type</option>
            </select>
        </div>
    </div>

    <!-- Folders Section -->
    <div class="mb-8" th:if="${not #lists.isEmpty(subFolders)}">
        <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center uppercase tracking-wide">
            <i class="fas fa-folder text-primary mr-2 text-xs"></i>
            Folders
        </h3>

        <!-- Grid View -->
        <div x-show="viewMode === 'grid'" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4  xl:grid-cols-6 gap-4">
            <div th:each="folder : ${subFolders}" class="file-card" x-data="{ dropdownOpen: false, dropdownX: 0, dropdownY: 0 }">
                <div class="folder-card-square cursor-pointer relative group transition-all duration-200"
                    th:data-folder-id="${folder.id}" th:data-folder-name="${folder.name}"
                    th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                    @contextmenu.prevent="dropdownOpen = true; dropdownX = $event.clientX; dropdownY = $event.clientY">

                    <!-- Folder Background Image -->
                    <div class="folder-icon"
                         th:data-folder-id="${folder.id}"
                         th:data-folder-name="${folder.name}"
                         th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                         @click="handleFolderClick($el.dataset.folderId, $el.dataset.folderName, $el.dataset.hasPassword)">
                        <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                             viewBox="0 0 512 512" xml:space="preserve" width="200px" height="200px" fill="#000000">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                            <g id="SVGRepo_iconCarrier">
                                <polygon style="fill:#009900;" points="197.84,98.88 168.72,64 58.16,64 23.28,98.88 23.28,145.44 488.72,145.44 488.72,98.88 "/>
                                <rect y="145.44" style="fill:#66CC00;" width="512" height="302.56"/>
                                <rect x="52.4" y="122.16" style="fill:#EFEFEF;" width="407.28" height="23.28"/>
                            </g>
                        </svg>
                    </div>


                    <!-- Password Badge -->
                    <span th:if="${folder.password != null and !folder.password.isEmpty()}"
                        class="absolute top-2 right-2 bg-amber-400 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center z-10 shadow-md">
                        <i class="fas fa-lock text-xs"></i>
                    </span>

                    <!-- Folder Name (always visible at bottom) -->
                    <div class="folder-name"
                         th:text="${folder.name}"
                         th:data-folder-id="${folder.id}"
                         th:data-folder-name="${folder.name}"
                         th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                         @click="handleFolderClick($el.dataset.folderId, $el.dataset.folderName, $el.dataset.hasPassword)">
                        Folder Name
                    </div>

                    <div class="folder-date"
                         th:text="${#temporals.format(folder.createdAt, 'dd/MM/yy')}">
                        Date
                    </div>

                    <!-- Dropdown Menu (Right-click) -->
                    <div x-show="dropdownOpen"
                         @click.away="dropdownOpen = false"
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         class="fixed w-36 bg-white rounded-md shadow-lg border border-gray-200 py-1 z-50"
                         :style="`left: ${dropdownX}px; top: ${dropdownY}px; display: none;`">

                        <!-- Open Folder -->
                        <button @click="handleFolderClick($event.currentTarget.closest('[data-folder-id]').dataset.folderId, $event.currentTarget.closest('[data-folder-id]').dataset.folderName, $event.currentTarget.closest('[data-folder-id]').dataset.hasPassword); dropdownOpen = false"
                                class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center">
                            <i class="fas fa-folder-open w-3 mr-2 text-gray-500 text-xs"></i>
                            Open
                        </button>

                        <!-- Set/Update Password -->
                        <button type="button"
                                class="folder-password-btn w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center"
                                th:data-folder-id="${folder.id}"
                                th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                                @click="dropdownOpen = false">
                            <i class="fas fa-lock w-3 mr-2 text-gray-500 text-xs"></i>
                            <span th:text="${folder.password != null and !folder.password.isEmpty()} ? 'Password' : 'Set Password'">Password</span>
                        </button>

                        <div class="border-t border-gray-100 my-1"></div>

                        <!-- Delete (Normal) -->
                        <form th:unless="${isTrash}" th:action="@{/files/folders/delete}" method="post" class="inline w-full"
                              onsubmit="return confirm('Move this folder to trash?');">
                            <input type="hidden" name="folderId" th:value="${folder.id}">
                            <button type="submit" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center">
                                <i class="fas fa-trash w-3 mr-2 text-xs"></i>
                                Delete
                            </button>
                        </form>

                        <!-- Restore (Trash) -->
                        <form th:if="${isTrash}" th:action="@{/files/trash/restore-folder}" method="post" class="inline w-full">
                            <input type="hidden" name="folderId" th:value="${folder.id}">
                            <button type="submit" class="w-full text-left px-3 py-1.5 text-xs text-green-600 hover:bg-green-50 flex items-center">
                                <i class="fas fa-trash-restore w-3 mr-2 text-xs"></i>
                                Restore
                            </button>
                        </form>

                        <!-- Permanent Delete (Trash) -->
                        <form th:if="${isTrash}" th:action="@{/files/trash/permanent-delete-folder}" method="post" class="inline w-full">
                            <input type="hidden" name="folderId" th:value="${folder.id}">
                            <button type="submit" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center">
                                <i class="fas fa-times w-3 mr-2 text-xs"></i>
                                Delete Forever
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- List View for Folders -->
        <div x-show="viewMode === 'list'" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="folder : ${subFolders}" class="hover:bg-gray-50 cursor-pointer"
                        th:data-folder-id="${folder.id}" th:data-folder-name="${folder.name}"
                        th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                        @click="handleFolderClick($event.currentTarget.dataset.folderId, $event.currentTarget.dataset.folderName, $event.currentTarget.dataset.hasPassword)">
                        <td class="px-6 py-4 w-12">
                            <i class="fas fa-folder text-primary text-lg"></i>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <span class="text-sm font-medium text-gray-900" th:text="${folder.name}">Folder</span>
                                <span th:if="${folder.password != null and !folder.password.isEmpty()}"
                                    class="ml-2 text-xs text-amber-600">
                                    <i class="fas fa-lock"></i>
                                </span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">Folder</td>
                        <td class="px-6 py-4 text-sm text-gray-500">—</td>
                        <td class="px-6 py-4 text-sm text-gray-500"
                            th:text="${#temporals.format(folder.createdAt, 'dd MMM yyyy')}">Date</td>
                        <td class="px-6 py-4 text-right" @click.stop>
                            <!-- Normal Actions -->
                            <div th:unless="${isTrash}" class="flex items-center justify-end space-x-2">
                                <button type="button" class="folder-password-btn p-2 text-gray-600 hover:bg-gray-100 rounded"
                                        th:data-folder-id="${folder.id}"
                                        th:data-has-password="${folder.password != null and !folder.password.isEmpty()}"
                                        title="Set Password">
                                    <i class="fas fa-lock text-xs"></i>
                                </button>
                                <form th:action="@{/files/folders/delete}" method="post" class="inline"
                                      onsubmit="return confirm('Move this folder to trash?');">
                                    <input type="hidden" name="folderId" th:value="${folder.id}">
                                    <button type="submit" class="p-2 text-red-600 hover:bg-red-50 rounded" title="Move to Trash">
                                        <i class="fas fa-trash text-xs"></i>
                                    </button>
                                </form>
                            </div>
                            <!-- Trash Actions -->
                            <div th:if="${isTrash}" class="flex items-center justify-end space-x-2">
                                <form th:action="@{/files/trash/restore-folder}" method="post" class="inline">
                                    <input type="hidden" name="folderId" th:value="${folder.id}">
                                    <button type="submit" class="p-2 text-green-600 hover:bg-green-50 rounded"
                                        title="Restore">
                                        <i class="fas fa-trash-restore text-xs"></i>
                                    </button>
                                </form>
                                <form th:action="@{/files/trash/permanent-delete-folder}" method="post" class="inline">
                                    <input type="hidden" name="folderId" th:value="${folder.id}">
                                    <button type="submit" class="p-2 text-red-600 hover:bg-red-50 rounded"
                                        title="Delete Permanently">
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Files Section -->
    <div th:if="${not #lists.isEmpty(files)}">
        <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center uppercase tracking-wide">
            <i class="fas fa-file text-primary mr-2 text-xs"></i>
            Files
        </h3>

        <!-- Grid View -->
        <div x-show="viewMode === 'grid'" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
            <div th:each="file : ${files}" class="file-card">
                <div
                    class="bg-white rounded-lg p-4 border border-gray-200 hover:border-primary cursor-pointer relative group transition-colors">
                    <!-- Checkbox -->
                    <input type="checkbox" th:value="${file.id}"
                        class="file-checkbox absolute top-2 left-2 w-4 h-4 text-green-600 rounded focus:ring-green-500"
                        @change="toggleFileSelection($event)">

                    <!-- File Icon/Thumbnail -->
                    <div class="flex items-center justify-center mb-3 mt-4">
                        <!-- Image Thumbnail -->
                        <div th:if="${#strings.startsWith(file.fileType, 'image')}"
                            class="w-full h-24 overflow-hidden rounded-lg">
                            <img th:src="'/' + ${file.filePath}" th:alt="${file.fileName}"
                                class="w-full h-full object-cover" />
                        </div>
                        <!-- File Type Icons -->
                        <i th:unless="${#strings.startsWith(file.fileType, 'image')}" class="text-5xl"
                            th:classappend="${#strings.startsWith(file.fileType, 'application/pdf') ? 'fas fa-file-pdf text-red-500' : 
                                            (#strings.contains(file.fileType, 'document') ? 'fas fa-file-word text-blue-500' : 
                                            (#strings.startsWith(file.fileType, 'video') ? 'fas fa-file-video text-purple-500' : 
                                            (#strings.startsWith(file.fileType, 'audio') ? 'fas fa-file-audio text-green-500' : 'fas fa-file text-gray-400')))}">
                        </i>
                    </div>

                    <!-- File Info -->
                    <h4 class="text-sm font-medium text-gray-900 truncate" th:text="${file.fileName}">
                        File Name
                    </h4>
                    <p class="text-xs text-gray-500 mt-1">
                        <span th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'">Size</span>
                    </p>

                    <!-- Quick Actions -->
                    <div th:unless="${isTrash}"
                        class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 flex space-x-1">
                        <button class="preview-file-btn p-1.5 bg-white rounded shadow hover:bg-gray-50 border border-gray-200"
                                th:data-file-id="${file.id}" th:data-file-name="${file.fileName}" title="Preview">
                            <i class="fas fa-eye text-xs text-gray-600"></i>
                        </button>
                        <a th:href="@{/files/download/{id}(id=${file.id})}"
                           class="p-1.5 bg-white rounded shadow hover:bg-gray-50 border border-gray-200 inline-block text-center" title="Download">
                            <i class="fas fa-download text-xs text-gray-600"></i>
                        </a>
                        <button class="share-file-btn p-1.5 bg-white rounded shadow hover:bg-gray-50 border border-gray-200"
                                th:data-file-id="${file.id}" th:data-file-name="${file.fileName}" title="Share">
                            <i class="fas fa-share text-xs text-gray-600"></i>
                        </button>
                        <a th:href="@{/files/delete/{id}(id=${file.id})}" onclick="return confirm('Move this file to trash?');"
                           class="p-1.5 bg-white rounded shadow hover:bg-red-50 border border-gray-200 inline-block text-center" title="Move to Trash">
                            <i class="fas fa-trash text-xs text-red-600"></i>
                        </a>
                    </div>

                    <!-- Trash Actions -->
                    <div th:if="${isTrash}"
                        class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 flex space-x-1">
                        <form th:action="@{/files/trash/restore-file}" method="post" class="inline">
                            <input type="hidden" name="fileId" th:value="${file.id}">
                            <button type="submit" class="p-1.5 bg-white rounded shadow hover:bg-green-50 border border-gray-200"
                                title="Restore">
                                <i class="fas fa-trash-restore text-xs text-green-600"></i>
                            </button>
                        </form>
                        <form th:action="@{/files/trash/permanent-delete-file}" method="post" class="inline">
                            <input type="hidden" name="fileId" th:value="${file.id}">
                            <button type="submit" class="p-1.5 bg-white rounded shadow hover:bg-red-50 border border-gray-200"
                                title="Delete Permanently">
                                <i class="fas fa-times text-xs text-red-600"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- List View -->
        <div x-show="viewMode === 'list'" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left">
                            <input type="checkbox" class="w-4 h-4 text-green-600 rounded">
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Size
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                            Modified</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">
                            Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="file : ${files}" class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <input type="checkbox" th:value="${file.id}" class="file-checkbox w-4 h-4 text-green-600 rounded" @change="toggleFileSelection($event)">
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <i class="fas fa-file-alt text-gray-400 mr-3"></i>
                                <span class="text-sm font-medium text-gray-900" th:text="${file.fileName}">File</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500" th:text="${file.fileType}">Type</td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            <span th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'">Size</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500"
                            th:text="${#temporals.format(file.createdAt, 'dd MMM yyyy')}">Date</td>
                        <td class="px-6 py-4 text-right">
                            <!-- Normal Actions -->
                            <div th:unless="${isTrash}" class="flex items-center justify-end space-x-2">
                                <button class="preview-file-btn p-2 text-gray-600 hover:bg-gray-100 rounded"
                                        th:data-file-id="${file.id}" th:data-file-name="${file.fileName}" title="Preview">
                                    <i class="fas fa-eye text-xs"></i>
                                </button>
                                <a th:href="@{/files/download/{id}(id=${file.id})}" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="Download">
                                    <i class="fas fa-download text-xs"></i>
                                </a>
                                <button class="share-file-btn p-2 text-gray-600 hover:bg-gray-100 rounded"
                                        th:data-file-id="${file.id}" th:data-file-name="${file.fileName}" title="Share">
                                    <i class="fas fa-share text-xs"></i>
                                </button>
                                <a th:href="@{/files/delete/{id}(id=${file.id})}" onclick="return confirm('Move this file to trash?');"
                                   class="p-2 text-red-600 hover:bg-red-50 rounded" title="Move to Trash">
                                    <i class="fas fa-trash text-xs"></i>
                                </a>
                            </div>
                            <!-- Trash Actions -->
                            <div th:if="${isTrash}" class="flex items-center justify-end space-x-2">
                                <form th:action="@{/files/trash/restore-file}" method="post" class="inline">
                                    <input type="hidden" name="fileId" th:value="${file.id}">
                                    <button type="submit" class="p-2 text-green-600 hover:bg-green-50 rounded"
                                        title="Restore">
                                        <i class="fas fa-trash-restore text-xs"></i>
                                    </button>
                                </form>
                                <form th:action="@{/files/trash/permanent-delete-file}" method="post" class="inline">
                                    <input type="hidden" name="fileId" th:value="${file.id}">
                                    <button type="submit" class="p-2 text-red-600 hover:bg-red-50 rounded"
                                        title="Delete Permanently">
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(subFolders) and #lists.isEmpty(files)}" class="text-center py-16">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mb-4">
            <i class="fas fa-folder-open text-4xl text-gray-400"></i>
        </div>
        <h3 class="text-lg font-medium text-gray-900 mb-2">No files or folders</h3>
        <p class="text-gray-500 mb-6">Get started by uploading files or creating folders</p>
        <div class="flex items-center justify-center space-x-4">
            <button @click="openUploadModal()"
                class="inline-flex items-center px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">
                <i class="fas fa-upload mr-2"></i>
                Upload Files
            </button>
            <button @click="openCreateFolderModal()"
                class="inline-flex items-center px-6 py-3 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                <i class="fas fa-folder-plus mr-2"></i>
                Create Folder
            </button>
        </div>
    </div>
</div>

</html>
