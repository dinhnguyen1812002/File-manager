<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6">
    <div class="flex items-center flex-1 max-w-2xl">
        <!-- Search Bar -->
        <div class="relative w-full">
            <input type="text" placeholder="Search files and folders..."
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                x-model="searchQuery">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center space-x-3 ml-6">
        <button @click="openUploadModal()"
            class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">
            <i class="fas fa-upload mr-2"></i>
            Upload
        </button>

        <button @click="openCreateFolderModal()"
            class="inline-flex items-center px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
            <i class="fas fa-folder-plus mr-2"></i>
            New Folder
        </button>

        <!-- View Toggle -->
        <div class="flex items-center bg-gray-100 rounded-lg p-1">
            <button @click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-white shadow-sm' : ''"
                class="p-2 rounded">
                <i class="fas fa-th text-gray-600"></i>
            </button>
            <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-white shadow-sm' : ''"
                class="p-2 rounded">
                <i class="fas fa-list text-gray-600"></i>
            </button>
        </div>
    </div>
</header>

</html>
